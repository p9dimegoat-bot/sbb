// ── AUDIO ENGINE ──────────────────────────────────────────────
let AC=null, curCard=null;
const activeNodes=[];
const volEl=document.getElementById('vol');

function ctx(){
  if(!AC) AC=new(window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended') AC.resume();
  return AC;
}

function stopAll(){
  activeNodes.forEach(n=>{try{n.stop(0);}catch(e){}});
  activeNodes.length=0;
  if(curCard){curCard.classList.remove('play');curCard=null;}
  document.getElementById('npb').classList.remove('show');
  document.getElementById('npi').textContent='';
}

function setNP(name,card){
  if(curCard&&curCard!==card) curCard.classList.remove('play');
  curCard=card; card.classList.add('play');
  document.getElementById('npn').textContent=name;
  document.getElementById('npi').textContent='▶ '+name;
  document.getElementById('npb').classList.add('show');
}

function playParams(p,card,name){
  stopAll();
  const c=ctx();
  const vol=(p.vol??0.6)*parseFloat(volEl.value);
  const{type='sine',freq=440,endFreq,duration=0.5,attack=0.005,release=0.1,
        harmonics=[],chord=[],arpeggio=[],noise,filter,steps}=p;

  const master=c.createGain();
  master.gain.setValueAtTime(vol,c.currentTime);
  master.connect(c.destination);

  function osc(f,ef,tp,d,v,off=0){
    const o=c.createOscillator(), g=c.createGain();
    o.connect(g); g.connect(master);
    o.type=tp||type;
    const t=c.currentTime+off;
    o.frequency.setValueAtTime(Math.max(f,1),t);
    if(ef!=null) o.frequency.exponentialRampToValueAtTime(Math.max(ef,1),t+d);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(v,t+Math.min(attack,d*0.3));
    g.gain.setValueAtTime(v,t+d-Math.min(release,d*0.4));
    g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.start(t); o.stop(t+d+0.02);
    activeNodes.push(o);
  }

  function noiseNode(d,fil,off=0){
    const bL=Math.floor(c.sampleRate*d);
    const buf=c.createBuffer(1,bL,c.sampleRate);
    const data=buf.getChannelData(0);
    for(let i=0;i<bL;i++) data[i]=Math.random()*2-1;
    const src=c.createBufferSource(); src.buffer=buf;
    const g=c.createGain();
    const t=c.currentTime+off;
    g.gain.setValueAtTime(vol*0.35,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    if(fil){
      const f=c.createBiquadFilter();
      f.type=fil.type||'lowpass';
      f.frequency.setValueAtTime(fil.freq||1000,t);
      if(fil.endFreq) f.frequency.exponentialRampToValueAtTime(fil.endFreq,t+d);
      f.Q.setValueAtTime(fil.q||1,t);
      src.connect(f); f.connect(g);
    } else { src.connect(g); }
    g.connect(master);
    src.start(t); src.stop(t+d);
    activeNodes.push(src);
  }

  if(steps&&steps.length){
    steps.forEach(([off2,f,ef2,tp,d])=>osc(f,ef2,tp,d,0.85,off2));
  } else if(arpeggio&&arpeggio.length){
    const step=duration/arpeggio.length;
    arpeggio.forEach((f,i)=>{ if(f>0) osc(f,null,type,step*0.88,0.85,i*step); });
  } else if(chord&&chord.length){
    chord.forEach(f=>osc(f,null,type,duration,0.5/chord.length));
  } else {
    if(!noise) osc(freq,endFreq,type,duration,0.9);
    harmonics.forEach(([hF,hV,hT])=>osc(hF,null,hT||type,duration,hV));
  }
  if(noise) noiseNode(duration,filter);

  setTimeout(()=>{
    if(curCard===card){card.classList.remove('play');curCard=null;document.getElementById('npb').classList.remove('show');document.getElementById('npi').textContent='';}
  },(duration+0.2)*1000);

  setNP(name,card);
}

// ── CATEGORIES & STATE ────────────────────────────────────────
const CATS=['All',...new Set(SOUNDS.map(s=>s.c))];
let cat='All', query='', filtered=[...SOUNDS];
const KEYS='abcdefghijklmnopqrstuvwxyz0123456789'.split('');

function getFiltered(){
  return SOUNDS.filter(s=>{
    const mc=cat==='All'||s.c===cat;
    const q=query.toLowerCase();
    return mc&&(!q||s.n.toLowerCase().includes(q)||s.c.toLowerCase().includes(q));
  });
}

function renderCats(){
  document.getElementById('cats').innerHTML=CATS.map(c=>
    `<button class="cat${c===cat?' on':''}" onclick="setCat(${JSON.stringify(c)})">${c}</button>`
  ).join('');
}

function renderGrid(){
  filtered=getFiltered();
  document.getElementById('st').textContent=`Showing ${filtered.length} / ${SOUNDS.length} sounds`;
  const g=document.getElementById('grid');
  if(!filtered.length){g.innerHTML='<div class="nor">🔍 No sounds found</div>';return;}
  g.innerHTML=filtered.map((s,i)=>{
    const k=i<KEYS.length?KEYS[i].toUpperCase():'';
    return`<div class="card" id="c${i}" onclick="go(${i})" title="${s.n}">
      <span class="em">${s.e}</span>
      <div class="nm">${s.n}</div>
      ${k?`<span class="kk">${k}</span>`:''}
      <div class="bar"></div>
    </div>`;
  }).join('');
}

window.setCat=function(c){cat=c;renderCats();renderGrid();};
window.go=function(i){
  const s=filtered[i]; if(!s)return;
  const card=document.getElementById('c'+i); if(!card)return;
  playParams(s.p,card,s.n);
};

// ── CONTROLS ──────────────────────────────────────────────────
document.getElementById('srch').addEventListener('input',e=>{query=e.target.value;renderGrid();});
document.getElementById('srch').addEventListener('keydown',e=>{
  if(e.key==='Escape'){e.target.value='';query='';renderGrid();e.target.blur();}
});
document.getElementById('stp').addEventListener('click',stopAll);

document.addEventListener('keydown',e=>{
  if(e.target===document.getElementById('srch'))return;
  if(e.key==='Escape'){stopAll();return;}
  if(e.key==='/'){e.preventDefault();document.getElementById('srch').focus();return;}
  const k=e.key.toLowerCase();
  const idx=KEYS.indexOf(k);
  if(idx!==-1&&idx<filtered.length) go(idx);
});

document.body.addEventListener('click',()=>{if(!AC)ctx();},{once:true});

// ── INIT ──────────────────────────────────────────────────────
renderCats();
renderGrid();
</script>
